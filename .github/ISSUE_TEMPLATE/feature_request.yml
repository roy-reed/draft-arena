name: 需求或改进
description: 新功能、玩法调整、工具或流程改进
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      placeholder: 现在……不方便 / 玩家会……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可选；不确定就留空
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      placeholder: |
        - [ ] 做到……就算完成
    validations:
      required: true
  - type: input
    id: gdd
    attributes:
      label: 相关 GDD 章节
      description: 可选
      placeholder: docs/GDD.md §4.2
  - type: dropdown
    id: decision
    attributes:
      label: 是否需要 Roy 拍板
      options:
        - 需要：改玩法、数值或范围
        - 不需要：可逆的小改动
        - 不确定
    validations:
      required: true
