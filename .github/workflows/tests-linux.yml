name: tests-linux

# Linux 上运行统一测试入口 ci/run-tests.ps1（不导出 exe，导出仍由 build-windows 负责）。
# pull_request 不限目标分支，叠加在其它 PR 分支上时也能运行。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 每天 03:17 北京时间（19:17 UTC）跑一次完整 soak
    - cron: '17 19 * * *'

permissions:
  contents: read

concurrency:
  group: tests-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.4.1-stable
  # SHA-512 取自 Godot 官方发布附带的 SHA512-SUMS.txt（godotengine/godot 4.4.1-stable，Godot_v4.4.1-stable_linux.x86_64.zip）
  GODOT_LINUX_SHA512: ef4e76880a514257175544952c61191106fdef3095b909bafed9fcbeb230c3e5533920a0f3012882dd4bbde83028a67549825794e2d2c3cf76eba7918b71370e

jobs:
  tests:
    runs-on: ubuntu-latest
    # PR #13 上完整运行（含 soak）实测 7 分 08 秒；快速模式 20 分钟、完整模式 60 分钟上限
    timeout-minutes: ${{ github.event_name == 'pull_request' && 20 || 60 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check doc references
        run: python3 ci/check_doc_refs.py

      - name: Cache Godot (Linux)
        id: godot-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools/godot-linux
          key: godot-linux-${{ env.GODOT_VERSION }}-${{ env.GODOT_LINUX_SHA512 }}

      - name: Setup Godot (verified)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: ./ci/install-godot-linux.sh .tools/godot-linux

      - name: Re-verify cached Godot binary exists
        run: test -x .tools/godot-linux/godot && .tools/godot-linux/godot --version

      # PR 上跑快速模式（不含 soak）；push main、定时和手动触发时跑完整 soak
      - name: Run tests (unified runner)
        shell: pwsh
        env:
          FULL_RUN: ${{ github.event_name != 'pull_request' }}
        run: |
          if ($env:FULL_RUN -eq 'true') { ./ci/run-tests.ps1 -Godot ./.tools/godot-linux/godot }
          else { ./ci/run-tests.ps1 -Godot ./.tools/godot-linux/godot -Quick }

      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tests-linux-logs
          path: '*.log'
          retention-days: 7
