name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  export:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        shell: pwsh
        run: |
          $v = "4.4.1-stable"
          $url = "https://github.com/godotengine/godot/releases/download/$v/Godot_v${v}_win64.exe.zip"
          New-Item -ItemType Directory -Force -Path .tools\godot | Out-Null
          Invoke-WebRequest -Uri $url -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath .tools\godot
          Rename-Item ".tools\godot\Godot_v${v}_win64.exe" godot.exe
          Rename-Item ".tools\godot\Godot_v${v}_win64_console.exe" godot_console.exe

      - name: Setup export templates
        shell: pwsh
        run: |
          $v = "4.4.1-stable"
          $dst = "$env:APPDATA\Godot\export_templates\$v"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $url = "https://github.com/godotengine/godot/releases/download/$v/Godot_v${v}_export_templates.tpz"
          Invoke-WebRequest -Uri $url -OutFile templates.tpz
          Rename-Item templates.tpz templates.zip
          Expand-Archive templates.zip -DestinationPath tmp_templates
          Copy-Item tmp_templates\templates\windows_release_x86_64.exe "$dst\" -Force
          Copy-Item tmp_templates\templates\windows_debug_x86_64.exe "$dst\" -Force

      - name: Import and smoke test
        shell: pwsh
        run: |
          .\.tools\godot\godot_console.exe --headless --path . --import 2>&1 | Out-Null
          .\.tools\godot\godot_console.exe --headless --path . -- --smoke | Tee-Object smoke.log
          if (-not (Select-String -Path smoke.log -Pattern "SMOKE_OK" -Quiet) ) { exit 1 }

      - name: Export exe
        shell: pwsh
        run: |
          .\.tools\godot\godot_console.exe --headless --path . --export-release "Windows" dist\DraftArena.exe
          if (-not (Test-Path dist\DraftArena.exe)) { exit 1 }

      - name: Smoke test exported exe
        shell: pwsh
        run: |
          .\dist\DraftArena.exe --headless -- --smoke | Tee-Object smoke2.log
          if (-not (Select-String -Path smoke2.log -Pattern "SMOKE_OK" -Quiet) ) { exit 1 }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DraftArena-win64
          path: dist/DraftArena.exe
          retention-days: 30
